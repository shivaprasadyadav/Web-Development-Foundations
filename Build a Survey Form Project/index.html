<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Survey Form</title>
<link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 id="title">TopCoder Academy Survay</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label id="name-label" for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your Name" required/>
      
      <label id="email-label" for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required/>
      <label id="number-label" id="number">Age:</label>
      <input type="number" id="number" placeholder="Age" min="10" max="120" required/>

      <label for="dropdown">Which option best to describes your current role?</label>
      <select id="dropdown">
        <option value="">Select current role</option>
        <option value="student">Student</option>
        <option value="job">Full Time Job</option>
        </select>

        <!-- RADIO BUTTONS - THIS WAS My ERROR, NOW FIZED -->
        <p>Would you recommend us?</p>
        <label><input type="radio" name="group1" value="definitely"> Definitely</label>
        <label><input type="radio" name="group1" value="maybe"> Maybe</label>
        <label><input type="radio" name="group1" value="not-sure"> Not Sure</label>

        <p>would you like to see improved?(check all that apply)</p>
        <label><input type="checkbox" value="frontend"> Front-end project</label>
        <label><input type="checkbox" value="backend"> Back-end project</label>
        <label><input type="checkbox" value="challenges"> Challenges</label>
        <label><input type="checkbox" value="videos"> Videos</label>
        <label><input type="checkbox" value="forum"> Forum</label>

        <label for="comments">Any comments or suggestions?</label>
        <textarea id="comments" placeholder="Enter your comment here..."></textarea>

        <button type="submit" id="submit">Submit</button>
        </form>
                </body>
  </html
